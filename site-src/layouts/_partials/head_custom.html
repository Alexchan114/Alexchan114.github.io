{{ if .IsHome }}
<meta name="description" content="{{ .Description }}" />
<link rel="canonical" href="{{ .Permalink }}" />
<meta property="og:type" content="website" />
<meta property="og:title" content="{{ .Title }}" />
<meta property="og:description" content="{{ .Description }}" />
<meta property="og:url" content="{{ .Permalink }}" />
<link rel="stylesheet" href="{{ "css/home-profile.css" | relURL }}" />
{{ end }}
{{ if or .Params.cae_article .Params.connector_article }}
<meta name="description" content="{{ .Description }}" />
<link rel="canonical" href="{{ .Permalink }}" />
<meta property="og:type" content="article" />
<meta property="og:title" content="{{ .Title }}" />
<meta property="og:description" content="{{ .Description }}" />
<meta property="og:url" content="{{ .Permalink }}" />
{{ if .Params.connector_article }}
{{ if eq .Language.Lang "en" }}
<meta property="og:image" content="{{ "articles/connector-simulation/cover.en.png" | absURL }}" />
{{ else }}
<meta property="og:image" content="{{ "articles/connector-simulation/cover.png" | absURL }}" />
{{ end }}
{{ else }}
<meta property="og:image" content="{{ "assets/cae-mcp/terminal_states.png" | absURL }}" />
{{ end }}
<link rel="stylesheet" href="{{ "css/cae-article.css" | relURL }}" />
{{ end }}
