bio:
  zh: 我关注机器学习与工程仿真的结合，探索有限元图代理模型、接触力学与仿真自动化。我的实践涵盖手机冲击响应建模、连接器力学仿真，以及结合结构稳定性评估的强化学习。
  en: I work at the intersection of machine learning and engineering simulation, with interests in graph-based finite-element surrogates, contact mechanics, and simulation automation. My experience spans smartphone impact modeling, connector mechanics, and reinforcement learning with structural stability evaluation.
