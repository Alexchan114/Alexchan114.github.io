experience:
  - start: '2026.07'
    end: '2026.09'
    organization: {zh: OPPO, en: OPPO}
    role: {zh: AI for CAE 实习生, en: AI for CAE Intern}
    description:
      zh: 面向手机冲击场景开发有限元图代理模型。基于 GraphGPS、Patch / Core-Halo 与多关系图网络，建模节点、单元及接触约束，并结合因果历史记忆与多 GPU 训练预测时序响应。
      en: Developed graph-based finite-element surrogates for smartphone impact simulations. Used GraphGPS, Patch / Core-Halo modeling, and multi-relation graph networks to represent nodes, elements, and contact constraints, combining causal history memory with multi-GPU training for temporal response prediction.
  - start: '2025.08'
    organization: {zh: 华为校企联合研发项目, en: University–Huawei research collaboration}
    role: {zh: 接插件力学仿真 · 项目负责人, en: Connector mechanics simulation · Project lead}
    description:
      zh: 研究公差组合下的连接器可靠度，结合代理模型与子结构降维；使用 HyperMesh、Abaqus、Tcl 和 abaqpy 实现公差抽样、网格检查与批量提交，并通过插拔物理实验对照仿真结果。
      en: Investigate connector reliability under tolerance combinations using surrogate models and substructuring. Automate tolerance sampling, mesh checks, and batch submission with HyperMesh, Abaqus, Tcl, and abaqpy, and compare simulation results with physical insertion and extraction tests.
  - start: '2025.07'
    end: '2025.10'
    organization: {zh: 奇绩创坛, en: MiraclePlus}
    role: {zh: 实习生 · 行业研究与技术商业化, en: Intern · Industry research & technology commercialization}
    description:
      zh: 参与前沿技术行业研究，关注 Physics AI 与工业仿真；参与技术商业化评价体系的数据整理、机器学习模型训练与技术资产因子分析。
      en: Conducted research on emerging technologies, including Physics AI and industrial simulation. Contributed data preparation, machine-learning model training, and technology-factor analysis to a research commercialization evaluation system.
  - start: '2024.08'
    end: '2025.02'
    organization: {zh: AGV 强化学习项目, en: AGV reinforcement learning project}
    role: {zh: 项目负责人, en: Project lead}
    description:
      zh: 为立体仓库货位优化构建 Gymnasium 环境，将结构稳定性纳入策略评估；结合 PPO / MAPPO、CoppeliaSim、Isaac Sim 和 SAP2000，完成仿真训练与实体仓库运行测试。
      en: Built a Gymnasium environment for warehouse slot allocation with structural stability in policy evaluation. Combined PPO / MAPPO, CoppeliaSim, Isaac Sim, and SAP2000 for simulation-based training and operational tests in a physical warehouse.
